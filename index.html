<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E3SEM1 CGPA Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- <span class="note">
            <select id="grade-scale" display="Enter the grade based on the list given">
                    <option value="Ex" disabled>10-Ex</option>
                    <option value="a" disabled>9-A</option>
                    <option value="b" disabled>8-B</option>

    <div class="bod">
        <h1>CGPA Calculator </h1>
        <div class="container">
            <form>
                <div class="subject">
                    <label>AI</label>
                    <input type="number" id="ai" class="credit" value=4 placeholder="Enter AI credits" />
                    <select class="grade">
                        <option value="10">Ex</option>
                        <option value="9">A</option>
                        <option value="8">B</option>
                        <option value="7">C</option>
                        <option value="6">D</option>
                    </select>
                </div>
                <div class="subject">
                    <label>CC</label>
                    <input type="number" id="cc" class="credit" value=3 placeholder="Enter Cloud Computing credits" />
                    <select class="grade">
                        <option value="10">Ex</option>
                        <option value="9">A</option>
                        <option value="8">B</option>
                        <option value="7">C</option>
                        <option value="6">D</option>
                    </select>
                </div>
                <div class="subject">
                    <label>OS</label>
                    <input type="number" id="os" class="credit" value=3 placeholder="Enter OS credits" />
                    <select class="grade" id="os-grade">
                        <option value="10">Ex</option>
                        <option value="9">A</option>
                        <option value="8">B</option>
                        <option value="7">C</option>
                        <option value="6">D</option>
                    </select>
                </div>
                <div class="subject">
                    <label>CN</label>
                    <input type="number" id="cn" class="credit" value=3 placeholder="Enter CN credits" />
                    <select class="grade">
                        <option value="10">Ex</option>
                        <option value="9">A</option>
                        <option value="8">B</option>
                        <option value="7">C</option>
                        <option value="6">D</option>
                    </select>
                </div>
                <div class="subject">
                    <label>SE</label>
                    <input type="number" id="se" class="credit" value=3 placeholder="Enter SE credits" />
                    <select class="grade">
                        <option value="10">Ex</option>
                        <option value="9">A</option>
                        <option value="8">B</option>
                        <option value="7">C</option>
                        <option value="6">D</option>
                    </select>
                </div>
                <div class="subject">
                    <label>Eng Lab</label>
                    <input type="number" id="eng" class="credit" value=1.5 placeholder="Enter English Lab credits" />
                    <select class="grade">
                        <option value="10">Ex</option>
                        <option value="9">A</option>
                        <option value="8">B</option>
                        <option value="7">C</option>
                        <option value="6">D</option>
                    </select>
                </div>
                <div class="subject">
                    <label>OS Lab</label>
                    <input type="number" id="osl" class="credit" value=1.5 placeholder="Enter OS Lab credits" />
                    <select class="grade">
                        <option value="10">Ex</option>
                        <option value="9">A</option>
                        <option value="8">B</option>
                        <option value="7">C</option>
                        <option value="6">D</option>
                    </select>
                </div>
                <div class="subject">
                    <label>CN Lab</label>
                    <input type="number" id="cnl" class="credit" value=1.5 placeholder="Enter CN Lab credits" />
                    <select class="grade">
                        <option value="10">Ex</option>
                        <option value="9">A</option>
                        <option value="8">B</option>
                        <option value="7">C</option>
                        <option value="6">D</option>
                    </select>
                </div>
                <div class="subject">
                    <label>SE Lab</label>
                    <input type="number" id="sel" class="credit" value=1.5 placeholder="Enter SE Lab credits" />
                    <select class="grade">
                        <option value="10">Ex</option>
                        <option value="9">A</option>
                        <option value="8">B</option>
                        <option value="7">C</option>
                        <option value="6">D</option>
                    </select>
                </div>
                <button type="button" onclick="calculateCGPA()" id="cgpacalc">Calculate CGPA</button>
                <div class="result">
                    <h2>Your CGPA: <span id="result">0.00</span></h2>
                </div>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
